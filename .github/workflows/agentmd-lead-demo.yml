name: AgentMD Lead Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lead-demo:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock

      - name: Scan repository security indicators
        shell: pwsh
        run: python scripts/security_scan.py

      - name: Audit Python dependencies
        shell: pwsh
        run: python -m pip_audit -r requirements-ci.lock --progress-spinner off

      - name: Validate CLI syntax
        shell: pwsh
        run: python -m py_compile cli/agentmd.py

      - name: Run AgentMD CLI tests
        shell: pwsh
        run: python -m pytest -q tests/agentmd/test_agentmd_cli.py

      - name: Run AI Work Lead demo
        shell: pwsh
        run: .\scripts\demo-lead-compile.ps1

      - name: Upload AI Work Lead proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentmd-lead-proof
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            .sticky/current-state.json
            .sticky/current-state.md
            .sticky/receipts/*.jsonl
