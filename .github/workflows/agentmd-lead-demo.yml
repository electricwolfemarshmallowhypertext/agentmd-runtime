name: AgentMD Lead Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lead-demo:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock

      - name: Scan repository security indicators
        shell: pwsh
        run: python scripts/security_scan.py

      - name: Audit Python dependencies
        shell: pwsh
        run: python -m pip_audit -r requirements-ci.lock --progress-spinner off

      - name: Validate CLI syntax
        shell: pwsh
        run: python -m py_compile cli/agentmd.py

      - name: Run AgentMD CLI tests
        shell: pwsh
        run: python -m pytest -q tests/agentmd/test_agentmd_cli.py

      - name: Run AI Work Lead demo
        shell: pwsh
        run: .\scripts\demo-lead-compile.ps1

      - name: Upload AI Work Lead proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentmd-lead-proof
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            .sticky/current-state.json
            .sticky/current-state.md
            .sticky/receipts/*.jsonl
