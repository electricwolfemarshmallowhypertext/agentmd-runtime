name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  agentmd-cli:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock

      - name: Scan repository security indicators
        shell: pwsh
        run: python scripts/security_scan.py

      - name: Audit Python dependencies
        shell: pwsh
        run: python -m pip_audit -r requirements-ci.lock --progress-spinner off

      - name: Validate CLI syntax
        shell: pwsh
        run: |
          python -m py_compile cli/agentmd.py

      - name: Run AgentMD CLI tests
        shell: pwsh
        run: |
          python -m pytest -q tests/agentmd/test_agentmd_cli.py
