name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  agentmd-cli:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock

      - name: Scan repository security indicators
        shell: pwsh
        run: python scripts/security_scan.py

      - name: Audit Python dependencies
        shell: pwsh
        run: python -m pip_audit -r requirements-ci.lock --progress-spinner off

      - name: Audit API direct dependencies
        shell: pwsh
        run: python -m pip_audit -r apps/api/requirements.txt --no-deps --disable-pip --progress-spinner off

      - name: Validate CLI syntax
        shell: pwsh
        run: |
          python -m py_compile cli/agentmd.py

      - name: Run AgentMD CLI tests
        shell: pwsh
        run: |
          python -m pytest -q tests/agentmd/test_agentmd_cli.py
